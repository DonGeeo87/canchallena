version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: canchallena-api
    restart: unless-stopped
    environment:
      - PORT=3018
      - DATA_DIR=/data
      - GOWA_URL=http://gowa:3000
      - GOWA_AUTH=admin:G0w4D0nGeeo87!
      - GOWA_DEVICE_ID=DonGeeo87
      - WHATSAPP_WEBHOOK_SECRET=G0w4H00kD0nGeeo87!
      - MP_ACCESS_TOKEN=APP_USR-3963058384630957-052010-b50e0a62ddbae788b70c1659bed0e83d-1812597329
      - MP_PUBLIC_KEY=APP_USR-05fdab0c-6079-43dc-b18d-e90a6176c0ca
      - SITE_URL=https://canchallena.codigoguerrero.dev
    ports:
      - "127.0.0.1:3018:3018"
    volumes:
      - canchallena_data:/data
    networks:
      - proxy-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: canchallena-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3019:80"
    networks:
      - proxy-network

volumes:
  canchallena_data:

networks:
  proxy-network:
    external: true
