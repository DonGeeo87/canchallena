name: Deploy CanchaLlena to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy project to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/opt/canchallena"
          strip_components: 0
          overwrite: true

      - name: Rebuild and restart web container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            cd /opt/canchallena
            docker compose build web apitest 2>/dev/null || docker compose build web
            docker compose up -d web
            # Re-sync api si cambió
            docker compose build api 2>/dev/null || true
            docker compose up -d api
            # Limpiar caché NPM para servir el bundle nuevo
            docker exec nginx-proxy-manager sh -c 'rm -rf /data/nginx/cache/* 2>/dev/null; nginx -s reload 2>/dev/null' || true
            echo "✅ CanchaLlena deploy complete"
